# OLM Subscription의 spec.config.resources로 operator Deployment 리소스를 덮어쓴다 (CSV 기본값을 통째로 대체)
# 기준: memory는 request = limit, cpu는 request만 둔다
subscriptions:
  keycloakOperator:
    resources:
      requests:
        cpu: 50m
        memory: 320Mi
      limits:
        memory: 320Mi
  grafanaOperator:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 64Mi
  kialiOperator:
    # reconcile 때 ansible 플레이북 실행으로 메모리가 튄다 (기동 시 최대 약 300Mi, 128Mi에서 OOMKilled)
    resources:
      requests:
        cpu: 10m
        memory: 384Mi
      limits:
        memory: 384Mi
  opentelemetryOperator:
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 96Mi
