apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apollo-router
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gatewayName }}
      namespace: istio-gateway
  hostnames: [ {{ .Values.httpRoute.hostname }} ]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /graphql
      backendRefs:
        - name: {{ .Values.httpRoute.service.name }}
          port: {{ .Values.httpRoute.service.port }}
