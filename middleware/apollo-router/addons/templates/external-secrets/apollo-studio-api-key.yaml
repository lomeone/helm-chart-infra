apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apollo-studio-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: apollo-studio-api-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: {{ .Values.externalSecrets.apolloStudioApiKey.secretsManagerName }}
        property: api-key
