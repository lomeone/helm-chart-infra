gatewayName: external-gateway

hostNames:
  - "lomeone.com"
  - "moyemap.com"

aws:
  loadBalancer:
    scheme: internet-facing
    securityGroups:
      - sg-021a36cffd44e8b26
    acm:
      certificates:
        - arn:aws:acm:ap-northeast-2:396428372646:certificate/754e3112-b0e7-4bd4-8af4-9795010dfe94
        - arn:aws:acm:ap-northeast-2:396428372646:certificate/d9b4a297-8109-4258-a0b1-6e4c31985ad5

# Gateway 파드(istio-proxy) 리소스. Gateway API infrastructure.parametersRef로 istio에 전달
# HPA가 CPU request 기준 50%에서 스케일아웃하므로 request를 너무 낮추지 않는다
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 2000m
    memory: 1Gi
