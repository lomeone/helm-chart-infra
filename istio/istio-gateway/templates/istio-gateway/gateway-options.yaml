{{- with .Values.resources }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Values.gatewayName }}-options
  namespace: istio-gateway
data:
  deployment: |
    spec:
      template:
        spec:
          containers:
            - name: istio-proxy
              resources:
                {{- toYaml . | nindent 16 }}
{{- end }}
