apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gatewayName }}
  namespace: istio-gateway
  labels:
    istio-component: gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-name: {{ .Values.gatewayName }}
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: {{ .Values.aws.loadBalancer.scheme }}
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
    service.beta.kubernetes.io/aws-load-balancer-security-groups: {{ .Values.aws.loadBalancer.securityGroups | join "," | quote }}
    service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "true"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: {{ .Values.aws.loadBalancer.acm.certificates | join "," | quote }}
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-ssl-negotiation-policy: "ELBSecurityPolicy-TLS13-1-2-Res-2021-06"
spec:
  gatewayClassName: istio
  listeners:
    {{- range .Values.hostNames }}
    - name: {{ . }}-http
      hostname: "*.{{ . }}"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: {{ . }}-https
      hostname: "*.{{ . }}"
      port: 443
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
