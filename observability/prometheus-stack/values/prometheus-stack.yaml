alertmanager:
  enabled: false
grafana:
  enabled: false
  forceDeployDatasources: false
  forceDeployDashboards: true
  defaultDashboardsEnabled: true
  operator:
    dashboardsConfigMapRefEnabled: true
    matchLabels:
      dashboard: grafana
kubeProxy:
  enabled: false
kube-state-metrics:
  image:
    registry: 396428372646.dkr.ecr.ap-northeast-2.amazonaws.com/k8s
  # 기동 시 클러스터 전체 리소스를 list하면서 메모리가 튄다 (64Mi에서 OOMKilled)
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 128Mi
nodeExporter:
  enabled: false
prometheusOperator:
  tls:
    enabled: false
  admissionWebhooks:
    enabled: false
    annotations:
      argocd.argoproj.io/hook: PreSync
      argocd.argoproj.io/hook-delete-policy: HookSucceeded
    mutatingWebhookConfiguration:
      annotations:
        argocd.argoproj.io/hook: PreSync

    validatingWebhookConfiguration:
      annotations:
        argocd.argoproj.io/hook: PreSync

    deployment:
      tls:
        enabled: false
    patch:
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: HookSucceeded
  resources:
    requests:
      cpu: 150m
      memory: 64Mi
    limits:
      memory: 64Mi
  image:
    registry: 396428372646.dkr.ecr.ap-northeast-2.amazonaws.com/quay-io
  prometheusConfigReloader:
    image:
      registry: 396428372646.dkr.ecr.ap-northeast-2.amazonaws.com/quay-io
    # operator가 만드는 모든 Prometheus(istio-prometheus 포함)의 config-reloader에 적용
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 32Mi

prometheus:
  prometheusSpec:
    image:
      registry: 396428372646.dkr.ecr.ap-northeast-2.amazonaws.com/quay-io
    enableRemoteWriteReceiver: true
    resources:
      requests:
        cpu: 100m
        memory: 1536Mi
      limits:
        memory: 1536Mi
cleanPrometheusOperatorObjectNames: true
