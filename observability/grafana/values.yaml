grafana:
  name: grafana
  image:
    repository: 396428372646.dkr.ecr.ap-northeast-2.amazonaws.com/docker-hub/grafana/grafana
    tag: 12.1.0
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 256Mi

datasources:
  prometheus:
    url: http://prometheus-stack-kube-prom-prometheus.observability.svc.cluster.local:9090/
  jaeger:
    url: http://jaeger-inmemory-instance-collector.observability.svc.cluster.local:16686/
