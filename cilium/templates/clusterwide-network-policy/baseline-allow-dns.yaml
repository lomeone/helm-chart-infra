# 모든 Pod -> CoreDNS(kube-dns) 허용
# - enableDefaultDeny: false 이므로 이 정책만으로는 어떤 Pod도 default-deny 상태가 되지 않는다.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: baseline-allow-dns
spec:
  description: "Allow all pods to resolve names via kube-dns"
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
